spring:
  application:
    name: book-bridges-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/book_bridges}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5          # Railway free tier: keep this low
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false             # FIX: prevent DB connections held during view rendering
    properties:
      hibernate:
        format_sql: true
        # FIX: removed explicit dialect — Hibernate auto-detects PostgreSQL

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 4             # Railway free tier: keep low
          max-idle: 2
          min-idle: 1
          max-wait: 1000ms

  # FIX: tell Spring Data to use JPA for these repositories, not Redis
  # Your repositories extend JpaRepository so this prevents double-scanning
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

server:
  port: ${PORT:8080}                # Railway injects PORT env var — must respect it
  error:
    include-message: always

jwt:
  secret: ${JWT_SECRET:YourSuperSecretSigningKeyThatIsAtLeast256BitsLongForHS256Algorithm}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  blacklist-prefix: "jwt:blacklist:"

gemini:
  api-key: ${GEMINI_API_KEY:}
  endpoint: "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.bookbridges: DEBUG
    org.springframework.security: INFO
    # FIX: silence the redundant UserDetailsService warning
    org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: ERROR

app:
  upload-dir: ${UPLOAD_DIR:/tmp/uploads}   # FIX: Railway has no D:/ drive — use /tmp
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

# FIX: merged spring.mail into main spring block (avoids duplicate key confusion)
spring:
  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enabled: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

notification:
  email-enabled: ${EMAIL_NOTIFICATIONS_ENABLED:true}
  from-address: ${MAIL_FROM:Book Bridges <no-reply@bookbridges.com>}