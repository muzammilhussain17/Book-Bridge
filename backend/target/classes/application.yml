spring:
  application:
    name: book-bridges-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/book_bridges
    username: postgres
    password: postgres123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379
      # password: YOUR_REDIS_PASSWORD  # uncomment if Redis has auth

server:
  port: 8080
  error:
    include-message: always

jwt:
  secret: "YourSuperSecretSigningKeyThatIsAtLeast256BitsLongForHS256Algorithm"
  expiration-ms: 86400000   # 24 hours
  blacklist-prefix: "jwt:blacklist:"

gemini:
  api-key: "[ENCRYPTION_KEY]"
  endpoint: "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.bookbridges: DEBUG
    org.springframework.security: INFO

app:
  upload-dir: D:/Book Bridges/backend/uploads
  frontend-url: http://localhost:5173

spring.mail:
  host: ${MAIL_HOST:smtp-relay.brevo.com}
  port: ${MAIL_PORT:587}
  username: ${MAIL_USERNAME:your-brevo-login@example.com}
  password: ${MAIL_PASSWORD:your-brevo-smtp-key}
  properties:
    mail:
      smtp:
        auth: true
        starttls:
          enabled: true
        connectiontimeout: 5000
        timeout: 5000
        writetimeout: 5000

notification:
  email-enabled: ${EMAIL_NOTIFICATIONS_ENABLED:true}
  from-address: ${MAIL_FROM:Book Bridges <no-reply@bookbridges.com>}
