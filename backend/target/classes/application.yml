spring:
  application:
    name: book-bridges-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/book_bridges
    username: postgres
    password: postgres123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379
      # password: YOUR_REDIS_PASSWORD  # uncomment if Redis has auth

server:
  port: 8080
  error:
    include-message: always

jwt:
  secret: "YourSuperSecretSigningKeyThatIsAtLeast256BitsLongForHS256Algorithm"
  expiration-ms: 86400000   # 24 hours
  blacklist-prefix: "jwt:blacklist:"

gemini:
  api-key: "AIzaSyBA3v27Pi78gcDttWXzlBUBP1L5YXjtrBI"
  endpoint: "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.bookbridges: DEBUG
    org.springframework.security: INFO

app:
  upload-dir: D:/Book Bridges/backend/uploads
