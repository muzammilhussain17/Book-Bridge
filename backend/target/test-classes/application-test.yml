spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: "TestSecretKeyThatIsAtLeast256BitsLongForTestingPurposesOnly123"
  expiration-ms: 3600000
  blacklist-prefix: "jwt:blacklist:"

gemini:
  api-key: "test-key"
  endpoint: "https://test.gemini.endpoint"
